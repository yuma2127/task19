<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>施設予約システム</title>
  <style>
    /* 外部CDN依存なし・警告なしの専用スタイル */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #4f46e5; }
    .btn { background: #4f46e5; color: #ffffff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #4338ca; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .card-title { font-weight: 700; color: #4338ca; margin-bottom: 4px; }
    .card-detail { font-size: 0.875rem; color: #334155; }
    .card-user { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; }
    .empty-msg { text-align: center; color: #94a3b8; font-size: 0.875rem; padding: 24px 0; }
    .user-box { display: flex; align-items: center; gap: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>施設予約システム</h1>
      <div id="auth-section">
        <button id="login-btn" class="btn">Googleでログイン</button>
        <div id="user-info" class="user-box hidden">
          <span id="user-name" style="font-size: 0.875rem; font-weight: 600; color: #475569;"></span>
          <button id="logout-btn" class="btn btn-secondary">ログアウト</button>
        </div>
      </div>
    </header>

    <!-- 予約登録フォーム -->
    <section id="form-section" class="hidden">
      <form id="reservation-form">
        <div class="form-group">
          <label for="facility">対象施設</label>
          <select id="facility" required>
            <option value="体育館">体育館</option>
            <option value="第1実習室">第1実習室</option>
            <option value="第2実習室">第2実習室</option>
            <option value="会議室">会議室</option>
          </select>
        </div>
        <div class="grid form-group">
          <div>
            <label for="reserve-date">日付</label>
            <input type="date" id="reserve-date" required>
          </div>
          <div>
            <label for="reserve-time">時間帯</label>
            <input type="time" id="reserve-time" required>
          </div>
        </div>
        <div class="form-group">
          <label for="purpose">使用目的・備考</label>
          <input type="text" id="purpose" placeholder="例: サークル練習" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-bottom: 24px;">予約を登録する</button>
      </form>
      <hr style="border: none; border-top: 1px solid #e2e8f0; margin-bottom: 24px;">
    </section>

    <!-- 予約一覧表示 -->
    <section>
      <h2 style="font-size: 1rem; font-weight: 600; margin-bottom: 12px;">現在の予約一覧</h2>
      <div id="reservation-list">
        <p class="empty-msg">ログインすると予約一覧の確認・追加ができます。</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ★ ご自身の Firebase コンソール「プロジェクトの設定」からコピーした値を貼り付けてください
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:xxxx"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // ログイン
    document.getElementById("login-btn").addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("ログインエラー: " + err.message + "\n\nStep 1 & 2 の設定を確認してください。");
      }
    });

    // ログアウト
    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    // 認証監視
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginBtn = document.getElementById("login-btn");
      const userInfo = document.getElementById("user-info");
      const formSection = document.getElementById("form-section");

      if (user) {
        loginBtn.classList.add("hidden");
        userInfo.classList.remove("hidden");
        formSection.classList.remove("hidden");
        document.getElementById("user-name").textContent = user.displayName;
        loadReservations();
      } else {
        loginBtn.classList.remove("hidden");
        userInfo.classList.add("hidden");
        formSection.classList.add("hidden");
        document.getElementById("reservation-list").innerHTML = 
          '<p class="empty-msg">ログインすると予約一覧の確認・追加ができます。</p>';
      }
    });

    // 予約送信
    document.getElementById("reservation-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      try {
        await addDoc(collection(db, "reservations"), {
          facility: document.getElementById("facility").value,
          date: document.getElementById("reserve-date").value,
          time: document.getElementById("reserve-time").value,
          purpose: document.getElementById("purpose").value,
          userName: currentUser.displayName,
          userId: currentUser.uid,
          createdAt: serverTimestamp()
        });
        document.getElementById("reservation-form").reset();
      } catch (err) {
        alert("保存エラー: " + err.message);
      }
    });

    // リアルタイムデータ取得
    function loadReservations() {
      const q = query(collection(db, "reservations"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const listEl = document.getElementById("reservation-list");
        listEl.innerHTML = "";

        if (snapshot.empty) {
          listEl.innerHTML = '<p class="empty-msg">予約データはありません。</p>';
          return;
        }

        snapshot.forEach((doc) => {
          const res = doc.data();
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-title">${res.facility}</div>
            <div class="card-detail">📅 ${res.date} ⏰ ${res.time} 〜 (${res.purpose})</div>
            <div class="card-user">予約者: ${res.userName || '不明'}</div>
          `;
          listEl.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
